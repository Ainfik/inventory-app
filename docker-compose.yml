services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: inventory-app

    ports:
      - "8000:8000"

    volumes:
      - .:/var/www

    environment:
      APP_ENV: local
      APP_DEBUG: true

      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: inventory_db
      DB_USERNAME: inventory_user
      DB_PASSWORD: inventory_password

    depends_on:
      database:
        condition: service_healthy

    restart: always

    networks:
      - inventory-network



  database:

    image: mysql:8.0

    container_name: inventory-db


    ports:
      - "3307:3306"


    environment:

      MYSQL_DATABASE: inventory_db

      MYSQL_USER: inventory_user

      MYSQL_PASSWORD: inventory_password

      MYSQL_ROOT_PASSWORD: rootpassword


    volumes:

      - mysql-data:/var/lib/mysql


    restart: always


    healthcheck:

      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    networks:

      - inventory-network



volumes:

  mysql-data:



networks:

  inventory-network:

    driver: bridge